<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#081226" />
  <title>Página web profesional</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    window.tailwind = window.tailwind || {};
    (() => {
    const c = n => `rgb(var(--${n}) / <alpha-value>)`;
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"], display: ["Outfit", "system-ui", "sans-serif"] },
        colors: { page: c("base"), alt: c("alt"), card: c("card"), line: c("line"), ink: c("ink"), muted: c("muted"),
                  acc: c("acc"), acc2: c("acc2"), onacc: c("onacc"), hero: c("hero"), tx: c("tx") }
      } }
    };
    })();
  </script>
  <style>
    /* Los colores se llenan según el giro (?giro=). Por defecto: servicios profesionales / contratistas. */
    :root { --base: 255 255 255; --alt: 244 246 250; --card: 255 255 255; --line: 226 232 240; --ink: 11 22 48; --muted: 91 103 130;
            --acc: 255 183 3; --acc2: 251 133 0; --onacc: 11 22 48; --hero: 8 18 38; --tx: 180 83 9; --shadow: 15 23 42;
            --accLight: #ffd97a; --glass: rgba(255,255,255,.72); --glass-line: rgba(226,232,240,.9); }
    html { scroll-behavior: smooth; scroll-padding-top: 120px; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: rgb(var(--base)); color: rgb(var(--ink));
           -webkit-font-smoothing: antialiased; overflow-x: hidden; opacity: 0; transition: opacity .5s; animation: mostrar 0s 2.5s forwards; }
    body.listo { opacity: 1; }
    @keyframes mostrar { to { opacity: 1; } }
    .font-display, .h2 { font-family: "Outfit", system-ui, sans-serif; }
    .h2 { font-weight: 800; letter-spacing: -.025em; line-height: 1.05; font-size: clamp(30px, 5.5vw, 52px); }

    /* ---------- color y vidrio ---------- */
    .grad { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); }
    .grad-text { background: linear-gradient(100deg, var(--accLight), rgb(var(--acc)) 55%, rgb(var(--acc2)));
                 -webkit-background-clip: text; background-clip: text; color: transparent; }
    .num { background: linear-gradient(135deg, rgb(var(--tx)), rgb(var(--acc2))); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); }
    .glass-strong { background: rgb(var(--card) / .9); border: 1px solid var(--glass-line); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); }
    .glass-dark { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff;
                  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
    .shadow-soft { box-shadow: 0 10px 30px -12px rgb(var(--shadow) / .18); }
    .shadow-deep { box-shadow: 0 40px 80px -30px rgb(var(--shadow) / .45), 0 18px 36px -18px rgb(var(--shadow) / .3); }
    .blob { position: absolute; width: 440px; height: 440px; border-radius: 50%; filter: blur(100px); opacity: .16; background: rgb(var(--acc)); pointer-events: none; }

    /* ---------- barra superior ---------- */
    .nav { background: rgba(10,14,25,.28); border: 1px solid rgba(255,255,255,.14); color: #fff;
           backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); transition: all .35s; }
    .nav-links a { opacity: .85; transition: .2s; }
    .nav-links a:hover { opacity: 1; color: var(--accLight); }
    html.solid .nav { background: rgb(var(--base) / .86); border-color: rgb(var(--line)); color: rgb(var(--ink)); box-shadow: 0 14px 40px -14px rgb(var(--shadow) / .3); }
    html.solid .nav-links a:hover { color: rgb(var(--tx)); }
    .lang { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); font-size: 12px; font-weight: 800; }
    .lang span { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 9px; transition: .25s; white-space: nowrap; opacity: .7; }
    .lang span.on { background: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); opacity: 1; box-shadow: 0 4px 14px -4px rgb(var(--acc) / .7); }
    .lang svg { width: 16px; height: 11px; border-radius: 2px; flex-shrink: 0; }
    html.solid .lang { background: rgb(var(--alt)); border-color: rgb(var(--line)); }

    /* ---------- portada ---------- */
    .hero-velo { background:
      linear-gradient(180deg, rgb(var(--hero) / .45) 0%, transparent 28%, rgb(var(--hero) / .5) 76%, rgb(var(--hero)) 100%),
      linear-gradient(100deg, rgb(var(--hero) / .88) 0%, rgb(var(--hero) / .6) 48%, rgb(var(--hero) / .18) 100%),
      radial-gradient(700px 500px at 15% 40%, rgb(var(--acc) / .22), transparent 70%); }
    .kb { animation: kb 18s ease-out both; }
    @keyframes kb { from { transform: scale(1.15); } to { transform: scale(1); } }
    .float-y { animation: flotar 6s ease-in-out infinite; }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* ---------- botones: brillo y pulso ---------- */
    .btn-shine { position: relative; overflow: hidden; isolation: isolate; }
    .btn-shine::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%);
      transform: translateX(-130%); animation: brillo 3.4s ease-in-out infinite; }
    @keyframes brillo { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
    .pulse { animation: pulso 2.4s infinite; }
    @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgb(var(--acc) / .55); } 70% { box-shadow: 0 0 0 16px rgb(var(--acc) / 0); } 100% { box-shadow: 0 0 0 0 rgb(var(--acc) / 0); } }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; box-shadow: 0 16px 30px -12px rgba(37,211,102,.7); }
    .btn-card { background: rgb(var(--ink)); color: rgb(var(--base)); }
    .btn-card:hover, .top .btn-card { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); }

    /* ---------- tarjetas de servicio ---------- */
    .tag-top { position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
               padding: 6px 12px; font-size: 12px; font-weight: 800; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); }
    .tag-star { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; }
    .check { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(16,185,129,.15); color: #10b981; font-size: 11px; flex-shrink: 0; }

    /* ---------- comparativa ---------- */
    .comparativa th, .comparativa td { padding: 14px 10px; text-align: center; border-top: 1px solid rgb(var(--line)); }
    .comparativa thead th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--muted)); }
    .comparativa td:first-child, .comparativa th:first-child { text-align: left; padding-left: 22px; font-weight: 600; }
    .comparativa .nos { background: rgb(var(--acc) / .09); }
    .comparativa thead .nos { color: rgb(var(--ink)); border-radius: 14px 14px 0 0; }
    .si, .no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; }
    .si { background: #10b981; color: #fff; box-shadow: 0 6px 14px -6px rgba(16,185,129,.8); }
    .no { background: rgba(239,68,68,.12); color: #ef4444; }
    .tal { font-size: 12px; font-weight: 700; color: #d97706; }

    /* ---------- FAQ ---------- */
    summary::-webkit-details-marker { display: none; }
    .faq-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 13px; transition: transform .3s; }
    details[open] .faq-ico { transform: rotate(45deg); }

    /* ---------- cotizador ---------- */
    .cot-bg { background:
      radial-gradient(600px 420px at 8% 8%, rgb(var(--acc) / .32), transparent 62%),
      radial-gradient(560px 520px at 95% 95%, rgb(var(--acc2) / .28), transparent 62%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 44px; }
    .paso { display: flex; align-items: center; gap: 10px; font-family: "Outfit"; font-weight: 700; font-size: 17px; margin-bottom: 12px; }
    .paso .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
    .chips { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .chips.serv { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .chip { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 12px 12px 14px; border-radius: 16px;
            border: 1.5px solid rgb(var(--line)); background: rgb(var(--alt) / .7); color: rgb(var(--ink)); font-weight: 650; font-size: 14px; line-height: 1.25;
            cursor: pointer; transition: transform .2s, border-color .2s, box-shadow .25s, background .25s; }
    .chips.serv .chip { padding: 8px 12px 8px 8px; }
    .chip:hover { border-color: rgb(var(--acc) / .6); transform: translateY(-2px); }
    .chip:active { transform: scale(.97); }
    .chip.on { border-color: rgb(var(--acc)); background: rgb(var(--acc) / .13); box-shadow: 0 0 0 4px rgb(var(--acc) / .16), 0 12px 26px -12px rgb(var(--acc) / .8); }
    .chip .ok { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; flex-shrink: 0;
                border: 1.5px solid rgb(var(--line)); color: transparent; transition: .25s; }
    .chip.on .ok { border-color: transparent; background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); transform: scale(1.1); }
    .lbl { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .inp { width: 100%; border: 1.5px solid rgb(var(--line)); background: rgb(var(--alt) / .7); color: rgb(var(--ink)); border-radius: 14px;
           padding: 13px 14px 13px 42px; font-size: 15px; outline: none; transition: .2s; }
    .inp::placeholder { color: rgb(var(--muted) / .8); }
    .inp:focus { border-color: rgb(var(--acc)); background: rgb(var(--card)); box-shadow: 0 0 0 4px rgb(var(--acc) / .15); }
    textarea.inp { padding-left: 14px; min-height: 110px; resize: vertical; }
    .inp-ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgb(var(--muted)); font-size: 14px; pointer-events: none; }
    .campo.error .inp, .campo.error .chip { border-color: #ef4444; }
    .campo.error .paso, .campo.error .lbl { color: #ef4444; }

    /* ---------- WhatsApp flotante ---------- */
    .wa-float { position: fixed; right: 18px; bottom: 18px; z-index: 60; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
                background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; font-size: 32px; border: 0; cursor: pointer; transition: transform .2s;
                animation: waPulso 2s infinite; }
    .wa-float:hover { transform: scale(1.08); }
    @keyframes waPulso { 0% { box-shadow: 0 0 0 0 rgba(37,211,102,.65), 0 14px 30px -8px rgba(37,211,102,.6); }
                         70% { box-shadow: 0 0 0 20px rgba(37,211,102,0), 0 14px 30px -8px rgba(37,211,102,.6); }
                         100% { box-shadow: 0 0 0 0 rgba(37,211,102,0), 0 14px 30px -8px rgba(37,211,102,.6); } }
    .wa-badge { position: absolute; top: -3px; right: -3px; min-width: 23px; height: 23px; border-radius: 999px; background: #ef4444; color: #fff;
                font: 800 12px/19px "Plus Jakarta Sans", sans-serif; text-align: center; border: 2px solid #fff; animation: saltito 2.6s ease-in-out infinite; }
    @keyframes saltito { 0%, 80%, 100% { transform: scale(1); } 88% { transform: scale(1.25); } }
    .aviso { position: fixed; left: 50%; top: 92px; z-index: 70; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: all .3s;
             background: rgb(var(--ink)); color: rgb(var(--base)); font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 999px;
             max-width: calc(100% - 32px); text-align: center; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); }
    .aviso.ver { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- animaciones al hacer scroll ---------- */
    .reveal { opacity: 0; }
    .reveal.in { opacity: 1; animation: subir .9s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--d, 0ms); }
    @keyframes subir { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    .ya .reveal { opacity: 1; animation: none; }
    .ya .kb { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none !important; }
      .kb, .float-y, .pulse, .btn-shine::after, .wa-float, .wa-badge { animation: none !important; }
    }
  </style>
</head>

    // ====== DIBUJAR LA PÁGINA ======
    let primera = true, contado = false;
    function render() {
      const U = UI[LANG];
      const y = scrollY;
      document.documentElement.lang = LANG;
      document.title = `${NEGOCIO} | ${L(G.etiqueta)}`;
      $("app").innerHTML = [hdr(U), hero(U), stats(U), nosotros(U), servicios(U), porQue(U), resenas(U), faq(U), cotizar(U), pie(U)].join("");
      $("waFlotante").setAttribute("aria-label", U.waAria);
      if (primera) { primera = false; observar(); }
      else { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); contar(true); scrollTo(0, y); }
      progreso();
    }

    // Animación al hacer scroll (fade-up) + contadores
    function observar() {
      if (!("IntersectionObserver" in window)) { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); contar(true); return; }
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
        { threshold: .12, rootMargin: "0px 0px -40px 0px" });
      document.querySelectorAll(".reveal").forEach(e => io.observe(e));
      const ioS = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { contar(); ioS.disconnect(); } }, { threshold: .35 });
      ioS.observe($("stats"));
    }
    function contar(final) {
      document.querySelectorAll("[data-count]").forEach(el => {
        const n = +el.dataset.count;
        if (final || contado) { el.textContent = n.toLocaleString("en-US"); return; }
        const t0 = performance.now(), dur = 1900;
        const paso = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString("en-US"); if (p < 1) requestAnimationFrame(paso); };
        requestAnimationFrame(paso);
      });
      contado = true;
    }

    // ====== LÓGICA DEL COTIZADOR ======
    function valor(c) {
      const U = UI[LANG], v = ESTADO[c.id];
      if (c.tipo === "servicio") return v === undefined ? "" : L(G.serv.lista[v].n);
      if (c.tipo === "chips") return v === undefined ? "" : L(c.opciones[v]);
      if (c.tipo === "entrega") { const dir = String(ESTADO.direccion || "").trim(); return v === 1 ? `${U.deliveryMsg}${dir ? ": " + dir : ""}` : U.pickupMsg; }
      const s = String(v || "").trim();
      if (c.tipo === "fecha" && s) { const [a, m, d] = s.split("-"); return `${m}/${d}/${a}`; }
      if (c.tipo === "hora" && s) { let [h, mi] = s.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(mi).padStart(2, "0")} ${ap}`; }
      return s;
    }
    function falta(c) {
      if (c.tipo === "entrega") return ESTADO.entrega === 1 && !String(ESTADO.direccion || "").trim();
      if (c.tipo === "tel") return String(ESTADO.telefono || "").replace(/\D/g, "").length < 10;
      return !!c.req && !valor(c);
    }
    function progreso() {
      const req = G.form.campos.filter(c => c.req);
      const pct = Math.round(100 * req.filter(c => !falta(c)).length / req.length);
      if ($("progBar")) { $("progBar").style.width = pct + "%"; $("progTxt").textContent = pct + "%"; }
    }
    const marcarChips = id => document.querySelectorAll(`[data-chips="${id}"] .chip`).forEach(b => b.classList.toggle("on", +b.dataset.i === ESTADO[id]));
    const limpiarError = id => document.querySelector(`[data-campo="${id}"]`)?.classList.remove("error");

    function validar() {
      let primero = null;
      G.form.campos.forEach(c => {
        const caja = document.querySelector(`[data-campo="${c.id}"]`), malo = falta(c);
        caja.classList.toggle("error", malo);
        if (malo && !primero) primero = caja;
      });
      if (primero) { avisar(UI[LANG].completa); primero.scrollIntoView({ behavior: "smooth", block: "center" }); return false; }
      return true;
    }
    function armarMensaje(tipo) {
      const U = UI[LANG];
      const orden = [...G.form.campos].sort((a, b) => (a.id === "nombre" ? 0 : a.id === "telefono" ? 1 : 2) - (b.id === "nombre" ? 0 : b.id === "telefono" ? 1 : 2));
      const cuerpo = orden.map(c => {
        const lab = L(c.label).replace(/\s*\((opcional|optional)\)/i, "");
        return `*${lab}${lab.endsWith("?") ? "" : ":"}* ${valor(c) || "—"}`;
      }).join("\n");
      const tel = String(ESTADO.telefono || "").trim();
      return tipo === "llamada"
        ? `📞 *${U.llamada} — ${L(G.form.tituloForm)}*\n*${U.para}:* ${NEGOCIO}\n\n${cuerpo}\n\n${U.llamame(tel)}`
        : `${G.emoji} *${L(G.form.tituloForm)}*\n*${U.para}:* ${NEGOCIO}\n\n${cuerpo}\n\n${U.gracias}`;
    }
    const abrirWa = texto => window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`, "_blank");

    // Tarjeta de servicio → marca ese servicio en el cotizador y baja
    function elegir(k) {
      const s = G.serv.lista[k];
      if (CAMPO_SERV) { ESTADO[CAMPO_SERV.id] = CAMPO_SERV.tipo === "servicio" ? k : s.o; marcarChips(CAMPO_SERV.id); limpiarError(CAMPO_SERV.id); }
      else if ($("f_pedido")) {
        const p = String(ESTADO.pedido || "").trim();
        ESTADO.pedido = (p ? p + "\n" : "") + "1 × " + L(s.n);
        $("f_pedido").value = ESTADO.pedido; limpiarError("pedido");
      }
      progreso();
      $("cotizar").scrollIntoView({ behavior: "smooth" });
      avisar(`✅ ${L(s.n)} ${UI[LANG].agregado}`);
    }

    // ====== EVENTOS (una sola vez; la página se redibuja al cambiar de idioma) ======
    document.addEventListener("click", e => {
      const t = e.target;
      if (t.closest("#langBtn")) {
        LANG = LANG === "es" ? "en" : "es";
        try { localStorage.setItem("vc_lang", LANG); } catch (err) {}
        document.documentElement.classList.add("ya");
        render(); return;
      }
      const card = t.closest("[data-elegir]");
      if (card) { elegir(+card.dataset.elegir); return; }
      const ch = t.closest(".chip");
      if (ch) {
        const id = ch.closest("[data-chips]").dataset.chips;
        ESTADO[id] = +ch.dataset.i; marcarChips(id); limpiarError(id);
        if (id === "entrega") { $("dirCaja").classList.toggle("hidden", ESTADO.entrega !== 1); if (ESTADO.entrega === 1) $("f_direccion").focus(); }
        progreso(); return;
      }
      if (t.closest("#btnEnviarWa")) { if (validar()) abrirWa(armarMensaje("whatsapp")); return; }
      if (t.closest("#btnLlamar")) { if (validar()) abrirWa(armarMensaje("llamada")); return; }
      if (t.closest("#pieWa")) { abrirWa(UI[LANG].saludo(NEGOCIO)); return; }
      if (t.closest("#waFlotante")) { $("cotizar").scrollIntoView({ behavior: "smooth" }); }
    });
    document.addEventListener("input", e => {
      const el = e.target;
      if (!el.classList.contains("inp")) return;
      const id = el.id.replace(/^f_/, "");
      ESTADO[id] = el.value;
      limpiarError(id === "direccion" ? "entrega" : id);
      progreso();
    });
    addEventListener("scroll", () => document.documentElement.classList.toggle("solid", scrollY > 40), { passive: true });

    let tAviso;
    function avisar(txt) {
      const a = $("aviso");
      a.textContent = txt; a.classList.add("ver");
      clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove("ver"), 2000);
    }

    render();
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("listo")));
  </script>
</body>
</html>
