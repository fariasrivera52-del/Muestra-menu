<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Burger Bros | Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --negro: #0b0b0b;
      --negro-2: #151515;
      --negro-3: #1f1f1f;
      --oro: #ffc229;
      --oro-2: #f5a400;
      --rojo: #e63232;
      --rojo-2: #b81d1d;
      --verde: #25d366;
      --verde-2: #1ebe5a;
      --texto: #f5f5f5;
      --texto-2: #a8a8a8;
      --radio: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Poppins", system-ui, sans-serif;
      background: var(--negro);
      color: var(--texto);
      min-height: 100vh;
      padding-bottom: 130px;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(230, 50, 50, 0.18), transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255, 194, 41, 0.12), transparent 40%);
      background-attachment: fixed;
    }

    .app { max-width: 520px; margin: 0 auto; }

    /* ---------- ENCABEZADO ---------- */
    header {
      position: relative;
      padding: 28px 16px 22px;
      text-align: center;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11,11,11,0.35), var(--negro) 95%),
        url("https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=900&q=70") center/cover;
      z-index: -1;
      filter: saturate(1.1);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--oro), var(--oro-2));
      font-size: 40px;
      box-shadow: 0 0 0 5px rgba(255,194,41,0.18), 0 10px 30px rgba(255,194,41,0.35);
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 62px;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--oro);
      text-shadow: 3px 3px 0 var(--rojo), 0 8px 30px rgba(0,0,0,0.7);
    }

    .slogan {
      font-size: 14px;
      color: #e8e8e8;
      margin-top: 6px;
      font-weight: 500;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.45);
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .estado b { color: var(--verde); }

    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 0 0 rgba(37,211,102,0.7);
      animation: latido 1.6s infinite;
      flex-shrink: 0;
    }

    @keyframes latido {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.7); }
      70% { box-shadow: 0 0 0 10px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }

    /* ---------- CATEGORÍAS ---------- */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(11,11,11,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #222;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 1;
      white-space: nowrap;
      border: 1px solid #333;
      background: var(--negro-2);
      color: var(--texto);
      padding: 10px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .tab.activa {
      background: linear-gradient(145deg, var(--oro), var(--oro-2));
      color: #111;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255,194,41,0.3);
    }

    /* ---------- SECCIONES ---------- */
    main { padding: 8px 16px 0; }

    section { scroll-margin-top: 70px; margin-top: 22px; }

    .titulo-cat {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 32px;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .titulo-cat::after {
      content: "";
      flex: 1;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--rojo), transparent);
    }

    /* ---------- TARJETA DE PRODUCTO ---------- */
    .card {
      position: relative;
      background: linear-gradient(160deg, var(--negro-3), var(--negro-2));
      border: 1px solid #2a2a2a;
      border-radius: var(--radio);
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      transition: border-color .25s, transform .25s;
    }

    .card.en-pedido { border-color: var(--oro); }

    .foto {
      position: relative;
      height: 190px;
      background: linear-gradient(135deg, #2a1a10, #3a1414);
    }

    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .foto::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(21,21,21,0.95));
    }

    .etiqueta {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: var(--rojo);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 5px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(230,50,50,0.5);
    }

    .badge-cant {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--oro);
      color: #111;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .card.en-pedido .badge-cant { display: flex; }

    .info { padding: 4px 16px 16px; }

    .info h3 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info p {
      font-size: 13.5px;
      color: var(--texto-2);
      line-height: 1.5;
    }

    .fila {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .precio {
      font-family: "Bebas Neue", sans-serif;
      font-size: 34px;
      color: var(--oro);
      letter-spacing: 1px;
      line-height: 1;
    }
    .precio small { font-family: "Poppins"; font-size: 12px; color: var(--texto-2); margin-left: 2px; }

    .contador {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0e0e0e;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 4px;
    }

    .btn-cant {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s, opacity .2s;
      line-height: 1;
    }
    .btn-cant:active { transform: scale(0.88); }

    .menos { background: #2b2b2b; color: var(--texto); }
    .menos:disabled { opacity: .35; cursor: default; }
    .mas { background: linear-gradient(145deg, var(--rojo), var(--rojo-2)); color: #fff; box-shadow: 0 4px 14px rgba(230,50,50,0.45); }

    .cant {
      min-width: 30px;
      text-align: center;
      font-weight: 700;
      font-size: 17px;
    }

    /* ---------- BARRA FLOTANTE ---------- */
    .barra {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 496px;
      z-index: 50;
      background: rgba(20,20,20,0.92);
      backdrop-filter: blur(14px);
      border: 1px solid #333;
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .resumen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 10px;
    }

    .resumen .items { font-size: 13px; color: var(--texto-2); }
    .resumen .items b { color: var(--texto); }

    .total { text-align: right; }
    .total span { font-size: 12px; color: var(--texto-2); display: block; }
    .total strong {
      font-family: "Bebas Neue", sans-serif;
      font-size: 32px;
      color: var(--oro);
      letter-spacing: 1px;
      line-height: 1;
      display: inline-block;
    }
    .total strong.pop { animation: pop .3s ease; }
    @keyframes pop { 50% { transform: scale(1.18); } }

    .btn-wa {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(145deg, var(--verde), var(--verde-2));
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
      cursor: pointer;
      transition: transform .12s, filter .2s, opacity .2s;
    }
    .btn-wa:active { transform: scale(0.97); }
    .btn-wa:disabled {
      background: #2b2b2b;
      color: #777;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-wa svg { width: 22px; height: 22px; fill: currentColor; }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 10px 16px 20px;
    }

    .aviso {
      position: fixed;
      left: 50%;
      bottom: 150px;
      transform: translateX(-50%) translateY(20px);
      background: var(--oro);
      color: #111;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      z-index: 60;
      white-space: nowrap;
    }
    .aviso.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🍔</div>
      <h1>Burger Bros</h1>
      <p class="slogan">Hamburguesas al carbón hechas con amor de hermanos</p>
      <div class="estado">
        <span class="punto"></span>
        <span><b>Abierto ahora</b> · Pedidos sin esperas</span>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="menu"></main>

    <footer>© Burger Bros · Precios en pesos mexicanos (MXN)</footer>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="barra">
    <div class="resumen">
      <div class="items" id="items">Tu pedido está vacío</div>
      <div class="total">
        <span>Total a pagar</span>
        <strong id="total">$0</strong>
      </div>
    </div>
    <button class="btn-wa" id="btnWa" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.32l-.34-.2-3.57.94.95-3.48-.22-.36a9.38 9.38 0 0 1-1.44-5.01c0-5.19 4.23-9.42 9.43-9.42 2.52 0 4.88.98 6.66 2.76a9.36 9.36 0 0 1 2.76 6.67c0 5.2-4.23 9.42-9.42 9.42M20.06 3.98A11.3 11.3 0 0 0 12.05.67C5.8.67.7 5.76.7 12.02c0 2 .52 3.95 1.52 5.67L.6 23.33l5.77-1.51a11.3 11.3 0 0 0 5.67 1.45h.01c6.25 0 11.34-5.09 11.35-11.35 0-3.03-1.18-5.88-3.33-8.02"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>

  <script>
    // ====== CONFIGURACIÓN ======
    // Cambia este número por el WhatsApp del negocio (código de país + número, sin + ni espacios)
    const WHATSAPP = "5215512345678";

    const CATEGORIAS = [
      { id: "hamburguesas", nombre: "Hamburguesas", icono: "🍔" },
      { id: "combos", nombre: "Combos", icono: "🍟" },
      { id: "bebidas", nombre: "Bebidas", icono: "🥤" }
    ];

    const PRODUCTOS = [
      {
        id: 1, cat: "hamburguesas", nombre: "La Clásica Bros", precio: 119, etiqueta: "La favorita",
        desc: "Carne de res de 180 g al carbón, queso cheddar derretido, lechuga fresca, jitomate, cebolla morada y nuestra salsa secreta en pan brioche tostado.",
        img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=75"
      },
      {
        id: 2, cat: "hamburguesas", nombre: "Doble Bacon BBQ", precio: 159, etiqueta: "🔥 Picosita",
        desc: "Doble carne jugosa, doble queso, tocino crujiente, aros de cebolla y salsa BBQ ahumada con un toque de chipotle. Para los de mucha hambre.",
        img: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=800&q=75"
      },
      {
        id: 3, cat: "combos", nombre: "Combo Bros", precio: 179, etiqueta: "Ahorra $25",
        desc: "La Clásica Bros + papas a la francesa doraditas y crujientes + refresco helado de 600 ml. El combo perfecto para cualquier antojo.",
        img: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=75"
      },
      {
        id: 4, cat: "combos", nombre: "Combo Monster", precio: 239, etiqueta: "Para compartir",
        desc: "Doble Bacon BBQ + papas gajo sazonadas con queso fundido y tocino + malteada de tu sabor favorito. Pura felicidad en charola.",
        img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=800&q=75"
      },
      {
        id: 5, cat: "bebidas", nombre: "Malteada de Fresa", precio: 79, etiqueta: "Cremosa",
        desc: "Helado artesanal de vainilla batido con fresas naturales, coronada con crema batida. Espesa, fría y deliciosa.",
        img: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=800&q=75"
      },
      {
        id: 6, cat: "bebidas", nombre: "Refresco Helado", precio: 35, etiqueta: "Bien frío",
        desc: "Refresco de cola de 600 ml servido con hielo. El compañero ideal para tu hamburguesa.",
        img: "https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=800&q=75"
      }
    ];

    // ====== ESTADO ======
    const carrito = {}; // { idProducto: cantidad }
    const pesos = n => "$" + n.toLocaleString("es-MX");

    // ====== PINTAR MENÚ ======
    const tabs = document.getElementById("tabs");
    const menu = document.getElementById("menu");

    CATEGORIAS.forEach((c, i) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (i === 0 ? " activa" : "");
      btn.dataset.cat = c.id;
      btn.textContent = `${c.icono} ${c.nombre}`;
      btn.onclick = () => document.getElementById(c.id).scrollIntoView({ behavior: "smooth" });
      tabs.appendChild(btn);

      const sec = document.createElement("section");
      sec.id = c.id;
      sec.innerHTML = `<h2 class="titulo-cat">${c.icono} ${c.nombre}</h2>`;

      PRODUCTOS.filter(p => p.cat === c.id).forEach(p => {
        const card = document.createElement("article");
        card.className = "card";
        card.id = "card-" + p.id;
        card.innerHTML = `
          <div class="foto">
            <span class="etiqueta">${p.etiqueta}</span>
            <span class="badge-cant" id="badge-${p.id}">0</span>
            <img src="${p.img}" alt="${p.nombre}" loading="lazy"
                 onerror="this.style.display='none'">
          </div>
          <div class="info">
            <h3>${p.nombre}</h3>
            <p>${p.desc}</p>
            <div class="fila">
              <div class="precio">${pesos(p.precio)}<small>MXN</small></div>
              <div class="contador">
                <button class="btn-cant menos" aria-label="Quitar uno" data-id="${p.id}" data-d="-1" disabled>−</button>
                <span class="cant" id="cant-${p.id}">0</span>
                <button class="btn-cant mas" aria-label="Agregar uno" data-id="${p.id}" data-d="1">+</button>
              </div>
            </div>
          </div>`;
        sec.appendChild(card);
      });

      menu.appendChild(sec);
    });

    // ====== SUMAR / RESTAR ======
    menu.addEventListener("click", e => {
      const btn = e.target.closest(".btn-cant");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const d = Number(btn.dataset.d);
      const nueva = Math.max(0, (carrito[id] || 0) + d);
      if (nueva === 0) delete carrito[id]; else carrito[id] = nueva;

      if (d > 0) {
        const p = PRODUCTOS.find(x => x.id === id);
        avisar(`✅ ${p.nombre} agregado`);
        if (navigator.vibrate) navigator.vibrate(15);
      }
      actualizar(id);
    });

    function actualizar(id) {
      const cant = carrito[id] || 0;
      document.getElementById("cant-" + id).textContent = cant;
      document.getElementById("badge-" + id).textContent = "x" + cant;
      document.getElementById("card-" + id).classList.toggle("en-pedido", cant > 0);
      document.querySelector(`.menos[data-id="${id}"]`).disabled = cant === 0;

      let total = 0, piezas = 0;
      for (const [pid, c] of Object.entries(carrito)) {
        total += PRODUCTOS.find(p => p.id === Number(pid)).precio * c;
        piezas += c;
      }

      const totalEl = document.getElementById("total");
      totalEl.textContent = pesos(total);
      totalEl.classList.remove("pop");
      void totalEl.offsetWidth;
      totalEl.classList.add("pop");

      document.getElementById("items").innerHTML = piezas
        ? `<b>${piezas}</b> producto${piezas > 1 ? "s" : ""} en tu pedido`
        : "Tu pedido está vacío";
      document.getElementById("btnWa").disabled = piezas === 0;
    }

    // ====== WHATSAPP ======
    document.getElementById("btnWa").addEventListener("click", () => {
      let total = 0;
      const lineas = [];
      PRODUCTOS.forEach(p => {
        const c = carrito[p.id];
        if (!c) return;
        const sub = p.precio * c;
        total += sub;
        lineas.push(`• ${c} x ${p.nombre} — ${pesos(sub)}`);
      });

      const mensaje =
        `🍔 *¡Hola Burger Bros!* Quiero hacer este pedido:\n\n` +
        lineas.join("\n") +
        `\n\n💰 *Total a pagar: ${pesos(total)} MXN*\n\n¡Gracias! 🙌`;

      window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`, "_blank");
    });

    // ====== AVISO ======
    let tAviso;
    function avisar(txt) {
      const a = document.getElementById("aviso");
      a.textContent = txt;
      a.classList.add("ver");
      clearTimeout(tAviso);
      tAviso = setTimeout(() => a.classList.remove("ver"), 1300);
    }

    // ====== PESTAÑA ACTIVA AL HACER SCROLL ======
    const obs = new IntersectionObserver(entradas => {
      entradas.forEach(en => {
        if (en.isIntersecting) {
          document.querySelectorAll(".tab").forEach(t =>
            t.classList.toggle("activa", t.dataset.cat === en.target.id));
        }
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("section").forEach(s => obs.observe(s));
  </script>
</body>
</html>
